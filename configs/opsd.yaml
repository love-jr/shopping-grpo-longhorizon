# Same shopping rollout protocol; native distillation replaces the task-reward loss.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - base_shopping
  - _self_

shopping_opsd:
  # scripts/prepare_opsd.py 的默认输出；preflight 会拒绝不存在的文件。
  contracts_path: outputs/opsd-core/contracts.json
  manifest_path: ${oc.env:SHOPPING_ENV_MANIFEST,data/environment.json}

shopping_dynamic_sampling:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.opsd.loss.install_opsd_loss

actor_rollout_ref:
  model:
    use_liger: true
    override_config:
      attn_implementation: flash_attention_2
  rollout:
    n: 1
    # vLLM prompt_logprobs are unscaled; use the same distribution in the actor.
    temperature: 1.0
    top_p: 1.0
    agent:
      num_workers: 2
      agent_loop_manager_class: shopping_grpo.training.opsd.worker.ShoppingOPSDManager

distillation:
  enabled: true
  n_gpus_per_node: 1
  nnodes: 1
  distillation_loss:
    # Sampled-token OPSD keeps the fused head and the full shopping horizon on two GPUs.
    loss_mode: k1
    use_task_rewards: false
    use_policy_gradient: true
    loss_max_clamp: 5.0
    log_prob_min_clamp: null
  teacher_models:
    teacher_model:
      model_path: ${actor_rollout_ref.model.path}
      num_replicas: 1
      inference:
        tensor_model_parallel_size: 1
        max_model_len: 32768
        # Prompt logprobs materialize vocabulary logits; bound each prefill chunk.
        max_num_batched_tokens: 1024
        max_num_seqs: 2
        temperature: 1.0

trainer:
  n_gpus_per_node: 1
  experiment_name: shopping-agent-opsd
