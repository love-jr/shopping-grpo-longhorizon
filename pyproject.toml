[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-grpo"
version = "0.1.0"
description = "ShopSimulator shopping-agent post-training and trajectory evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # 不加 [conv1d]：causal-conv1d 仅源码包，1.7.0 依赖 torch>2.11 的符号，导入即崩。
  "flash-linear-attention>=0.5.2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
eval = []
sft = [
  "torch>=2.5",
  "transformers @ git+https://github.com/huggingface/transformers.git@7ea2320c76117e6742364808a666ef6f2fb40a67",
  "peft>=0.15,<1",
  "accelerate>=1,<2",
  "torchvision",
  "pillow",
  "swanlab>=0.8,<1",
  "liger-kernel>=0.6,<1",
]
sft-accelerated = [
  "bitsandbytes>=0.45,<1",
]
grpo = [
  "verl==0.8.0",
  "vllm==0.25.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchaudio==2.11.0",
  "transformers @ git+https://github.com/huggingface/transformers.git@7ea2320c76117e6742364808a666ef6f2fb40a67",
  "ray[default]==2.56.1",
  "tensordict==0.10.0",
  "numpy==2.2.6",
  "swanlab==0.9.1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
shopping-grpo = "shopping_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shopping_grpo.resources" = ["*.json"]

[tool.uv]
override-dependencies = [
  "numpy==2.2.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["shopping_grpo"]
ignore_missing_imports = true
